name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  unit:
    # Python 3.8 has no setup-python build for newer images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - run: python3 -m unittest discover -s tests -v

  smoke_claude:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash tests/smoke_claude.sh

  smoke_codex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @openai/codex
      - run: bash tests/smoke_codex.sh
